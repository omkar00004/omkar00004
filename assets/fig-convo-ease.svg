<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t">
<title id="t">Convo-Ease: text, image and audio are reduced to unified text, checked by a policy-as-prompt gate, then sent or held. Recall on 300 held-out messages rises from 46.0% with a generic taxonomy to 76.7% with organization rules (McNemar p = 0.004).</title>
<style>
  .serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs><marker id="a" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#292D28"/></marker></defs>
<rect x=".75" y=".75" width="398.5" height="258.5" rx="8" fill="#F3EBDD" stroke="#D7C5A5" stroke-width="1.5"/>
<text class="serif" x="20" y="32" font-size="15" fill="#292D28"><tspan font-weight="700">Fig. 1.</tspan><tspan font-style="italic"> Pre-delivery gatekeeper</tspan></text>

<g class="mono" font-size="13" text-anchor="middle">
  <g fill="none" stroke="#292D28"><rect x="20" y="48" width="74" height="26" rx="13"/><rect x="20" y="82" width="74" height="26" rx="13"/><rect x="20" y="116" width="74" height="26" rx="13"/></g>
  <g fill="#292D28"><text x="57" y="65">text</text><text x="57" y="99">image</text><text x="57" y="133">audio</text></g>
</g>
<g fill="none" stroke="#292D28" stroke-width="1.2" marker-end="url(#a)">
  <path d="M94 61C106 61 104 92 114 94"/><path d="M94 95H114"/><path d="M94 129C106 129 104 98 114 96"/>
  <path d="M204 95H222"/><path d="M316 85L330 78"/><path d="M316 105L330 112"/>
</g>
<rect x="116" y="74" width="88" height="42" rx="6" fill="#405A6B"/>
<g class="sans" font-size="13" fill="#F3EBDD" text-anchor="middle"><text x="160" y="92">unified</text><text x="160" y="108">text</text></g>
<text class="mono" x="270" y="53" font-size="11" fill="#5E625A" text-anchor="middle">org rules</text>
<path d="M270 57V64" stroke="#A65F46" stroke-width="1.5"/>
<rect x="224" y="64" width="92" height="62" rx="6" fill="#A65F46"/>
<g class="sans" font-size="13.5" font-weight="600" fill="#F3EBDD" text-anchor="middle"><text x="270" y="91">policy-as-</text><text x="270" y="108">prompt</text></g>
<g class="mono" font-size="12" text-anchor="middle">
  <rect x="332" y="66" width="56" height="22" rx="11" fill="none" stroke="#71816B" stroke-width="1.3"/>
  <text x="360" y="81" fill="#4F5C4A">✓ send</text>
  <rect x="332" y="102" width="56" height="22" rx="11" fill="none" stroke="#A65F46" stroke-width="1.3"/>
  <text x="360" y="117" fill="#A65F46">✗ hold</text>
</g>

<path d="M20 152H380" stroke="#D7C5A5" stroke-width="1.2"/>
<g class="mono" font-size="12">
  <text x="20" y="174" fill="#5E625A">recall · 300 held-out msgs</text>
  <text x="380" y="174" fill="#A65F46" text-anchor="end">p = 0.004</text>
</g>
<g class="sans" font-size="13">
  <text x="20" y="199" fill="#5E625A">generic taxonomy</text>
  <text x="20" y="227" fill="#292D28" font-weight="600">org rules (ours)</text>
</g>
<rect x="146" y="187" width="87" height="16" fill="#D7C5A5"/>
<rect x="146" y="215" width="146" height="16" fill="#A65F46"/>
<g class="mono" font-size="12.5">
  <text x="241" y="199" fill="#5E625A">46.0%</text>
  <text x="300" y="227" fill="#292D28" font-weight="700">76.7%</text>
</g>
<text class="serif" x="20" y="250" font-size="12.5" font-style="italic" fill="#5E625A">No retraining across 15 rule sets.</text>
</svg>
